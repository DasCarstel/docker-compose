services:
  truecommand:
    image: ghcr.io/ixsystems/truecommand:v3.1.0
    container_name: truecommand
    restart: unless-stopped
    volumes:
      - /etc/docker/truecommand/config:/data
    # TrueCommand läuft im Docker-Netzwerk und kann das Cloudflare-TLS-Zertifikat
    # von Traefik für truenas.mueller-nas.de nicht verifizieren ("tls: unrecognized
    # name"). Der extra_hosts-Eintrag umgeht Traefik und routet direkt zur
    # TrueNAS-VM -- nur für die interne API-Kommunikation von TrueCommand.
    # Browser-Traffic läuft weiterhin über Traefik mit gültigem Cloudflare-TLS.
    extra_hosts:
      - "truenas.mueller-nas.de:10.0.10.30"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.truecommand.entrypoints=https"
      - "traefik.http.routers.truecommand.rule=Host(`truecommand.mueller-nas.de`)"
      - "traefik.http.routers.truecommand.tls=true"
      - "traefik.http.routers.truecommand.tls.certresolver=cloudflare"
      - "traefik.http.services.truecommand.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"

networks:
  proxy:
    external: true
