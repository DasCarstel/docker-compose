services:
  ntfy:
    image: binwiederhier/ntfy:v2.31.0
    container_name: ntfy
    command: serve
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - NTFY_BASE_URL=https://ntfy.mueller-nas.de
      - NTFY_BEHIND_PROXY=true
      - NTFY_LISTEN_HTTP=:80
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_ENABLE_LOGIN=true
      - NTFY_CACHE_DURATION=24h
      - NTFY_ATTACHMENT_CACHE_DIR=/var/lib/ntfy/attachments
      - NTFY_ATTACHMENT_TOTAL_SIZE_LIMIT=1G
      - NTFY_VISITOR_REQUEST_LIMIT_BURST=100000
      - NTFY_VISITOR_REQUEST_LIMIT_REPLENISH=1s
      - NTFY_VISITOR_MESSAGE_LIMIT_BURST=100000
      - NTFY_VISITOR_MESSAGE_LIMIT_REPLENISH=1s
      - NTFY_LOG_LEVEL=info
    volumes:
      - /etc/docker/ntfy:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.ntfy.entrypoints=http"
      - "traefik.http.routers.ntfy.rule=Host(`ntfy.mueller-nas.de`)"
      - "traefik.http.routers.ntfy.middlewares=ntfy-https-redirect"
      - "traefik.http.middlewares.ntfy-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.ntfy-secure.entrypoints=https"
      - "traefik.http.routers.ntfy-secure.rule=Host(`ntfy.mueller-nas.de`)"
      - "traefik.http.routers.ntfy-secure.tls=true"
      - "traefik.http.routers.ntfy-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.ntfy-secure.service=ntfy"
      - "traefik.http.services.ntfy.loadbalancer.server.port=80"
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true
