<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprache zu Text</title>
<style>
  :root { color-scheme: light dark; --accent:#2f6fed; --accent-soft:#eaf1ff; --bg:#f6f7f9; --card:#fff;
          --text:#1b1f24; --muted:#68707c; --line:#dde1e6; --ok:#1f8a4c; --ok-soft:#e7f6ec;
          --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 28px -14px rgba(16,24,40,.22); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1216; --card:#171b21; --text:#e8ebef; --muted:#9aa3ae; --line:#262c34;
            --accent-soft:#16233b; --ok:#3fbf72; --ok-soft:#14301f;
            --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.65); }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px 64px; background:var(--bg); color:var(--text);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.sub { margin:0 0 24px; color:var(--muted); font-size:.9rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; box-shadow:var(--shadow); }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  button, label.btn { border:1px solid var(--line); background:var(--card); color:var(--text);
      border-radius:9px; padding:9px 14px; font:inherit; cursor:pointer;
      transition: background .16s ease, border-color .16s ease, color .16s ease, transform .12s ease, box-shadow .16s ease; }
  button:hover:not(:disabled):not(.rec), label.btn:hover { border-color:var(--accent); }
  button:active:not(:disabled), label.btn:active { transform: scale(.97); }
  button:focus-visible, select:focus-visible, textarea:focus-visible, .item .txt:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button.ghost { background:transparent; border-color:transparent; color:var(--muted); padding:6px 10px; font-size:.85rem; }
  button.ghost:hover { color:var(--text); border-color:var(--line); }
  button.copy { min-width:134px; display:inline-flex; align-items:center; justify-content:center; gap:7px; }
  button.copy .ico { fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  button.copy .ico-check { display:none; }
  button.copy.ok { background:var(--ok-soft); border-color:var(--ok); color:var(--ok); }
  button.copy.ok .ico-copy { display:none; }
  button.copy.ok .ico-check { display:inline-block; animation: pop .34s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { 0% { transform: scale(.55); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.rec { border-color:#d9534f; color:#d9534f; font-weight:600; }
  button.rec.on { background:#d9534f; color:#fff; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  select { font:inherit; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  textarea { width:100%; min-height:180px; resize:vertical; font:inherit; padding:12px;
      border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  .status { color:var(--muted); font-size:.85rem; min-height:1.4em; margin-top:10px; }
  .drop { border:2px dashed var(--line); border-radius:12px; padding:22px; text-align:center; color:var(--muted); }
  .drop.hot { border-color:var(--accent); color:var(--accent); }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#d9534f; margin-right:7px; vertical-align:1px; }
  .dot.hidden { display:none; }
  h2 { font-size:1rem; margin:0; }
  .hist-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
  #histlist { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .item { border:1px solid var(--line); border-radius:10px; padding:12px; background:var(--bg); animation: slidein .26s ease both; }
  @keyframes slidein { from { opacity:0; transform: translateY(-4px); } to { opacity:1; transform:none; } }
  .item.new { animation: slidein .26s ease both, flash 1.5s ease both; }
  @keyframes flash { 0% { border-color:var(--ok); box-shadow:0 0 0 3px var(--ok-soft); }
                     100% { border-color:var(--line); box-shadow:none; } }
  .item .meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:.75rem; color:var(--muted); margin-bottom:8px; }
  .tag { border:1px solid var(--line); border-radius:999px; padding:1px 8px; }
  .item .txt { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font-size:.92rem; cursor:pointer;
               display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .item.open .txt { display:block; -webkit-line-clamp:unset; }
  .item .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .item .actions button { padding:5px 10px; font-size:.82rem; }
  .empty { color:var(--muted); font-size:.88rem; margin:0; }
  a { color:var(--accent); }
  footer { color:var(--muted); font-size:.8rem; text-align:center; margin-top:24px; }
</style>
</head>
<body>
<main>
  <h1>Sprache zu Text</h1>
  <p class="sub">Qwen3-ASR auf <code>stt.mueller-nas.de</code> &middot; kurze Diktate und Dateien bis 100 MB</p>

  <div class="card">
    <div class="row">
      <button id="rec" class="rec"><span class="dot hidden" id="dot"></span><span id="reclabel">Aufnahme starten</span></button>
      <label class="btn" for="file">Datei w&auml;hlen</label>
      <input id="file" type="file" accept="audio/*,video/*" hidden>
      <select id="lang" title="Sprache">
        <option value="">Automatisch</option>
        <option value="de">Deutsch</option>
        <option value="en">Englisch</option>
      </select>
    </div>
    <div class="status" id="status" aria-live="polite">Bereit.</div>
  </div>

  <div class="card">
    <div class="drop" id="drop">Audiodatei hier hineinziehen</div>
  </div>

  <div class="card">
    <textarea id="out" placeholder="Transkript erscheint hier &hellip;" spellcheck="false"></textarea>
    <div class="row" style="margin-top:12px">
      <button id="copy" class="copy" type="button">
        <svg class="ico ico-copy" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
        <svg class="ico ico-check" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>
        <span id="copylabel">Kopieren</span>
      </button>
      <button id="save">Als .txt speichern</button>
      <button id="clear">Leeren</button>
    </div>
  </div>

  <section class="card">
    <div class="hist-head">
      <h2>Verlauf</h2>
      <button id="histclear" class="ghost" type="button">Verlauf l&ouml;schen</button>
    </div>
    <p class="empty" id="histempty">Noch keine Transkripte.</p>
    <ul id="histlist"></ul>
  </section>

  <footer>L&auml;uft lokal auf dem NAS &middot; kein Cloud-Dienst &middot; Anmeldung &uuml;ber Authentik</footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const statusEl = $("status"), out = $("out");
let recorder = null, chunks = [], started = 0, timer = null;
const HIST_KEY = "stt.history.v1", HIST_MAX = 50;

function setStatus(text, busy) {
  statusEl.textContent = text;
  $("rec").disabled = !!busy;
  $("file").disabled = !!busy;
}

function setRecLabel(text) {
  const el = $("reclabel");
  if (el) el.textContent = text; else $("rec").textContent = text;
}

/* ---- Audio -> 16 kHz Mono WAV ---- */
async function toWav(blob) {
  const raw = await blob.arrayBuffer();
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let decoded;
  try {
    decoded = await ctx.decodeAudioData(raw);
  } finally {
    ctx.close();
  }
  const rate = 16000;
  const frames = Math.max(1, Math.ceil(decoded.duration * rate));
  const offline = new OfflineAudioContext(1, frames, rate);
  const src = offline.createBufferSource();
  src.buffer = decoded;
  src.connect(offline.destination);
  src.start();
  const rendered = await offline.startRendering();
  return encodeWav(rendered.getChannelData(0), rate);
}

function encodeWav(samples, rate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  const str = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
  str(0, "RIFF"); view.setUint32(4, 36 + samples.length * 2, true); str(8, "WAVE");
  str(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, 1, true); view.setUint32(24, rate, true);
  view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  str(36, "data"); view.setUint32(40, samples.length * 2, true);
  let off = 44;
  for (let i = 0; i < samples.length; i++, off += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([view], { type: "audio/wav" });
}

/* ---- Transkription ---- */
async function send(blob) {
  const t0 = performance.now();
  setStatus("Wandle Audio \u2026");
  let wav;
  try {
    wav = await toWav(blob);
  } catch (err) {
    setStatus("Audio konnte nicht gelesen werden: " + err.message);
    return;
  }
  const secs = (wav.size / 32000).toFixed(1);
  setStatus("Transkribiere " + secs + " s Audio \u2026", true);
  const lang = $("lang").value;
  const url = "/api/transcribe" + (lang ? "?lang=" + lang : "");
  try {
    const resp = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "audio/wav" },
      body: wav
    });
    const ctype = resp.headers.get("content-type") || "";
    const isJson = ctype.indexOf("json") !== -1;
    const data = isJson ? await resp.json().catch(() => ({})) : {};
    if (!resp.ok) {
      setStatus("Fehler " + resp.status + ": " + (data.error || data.detail || "unbekannt"));
      return;
    }
    if (!isJson) {
      setStatus("Antwort war kein JSON (evtl. Anmeldung abgelaufen) \u2013 Seite neu laden.");
      return;
    }
    out.value = (data.text || "").trim();
    out.scrollIntoView({block:"center", behavior:"smooth"});
    const ms = Math.round(performance.now() - t0);
    setStatus(out.value ? "Fertig in " + ms + " ms (" + secs + " s Audio)." : "Keine Sprache erkannt.");
    if (out.value) {
      addHist({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        ts: Date.now(),
        text: out.value,
        lang: lang || "auto",
        secs: Number(secs)
      });
    }
  } catch (err) {
    setStatus("Netzwerkfehler: " + err.message);
  }
}

/* ---- Aufnahme ---- */
$("rec").onclick = async () => {
  if (recorder && recorder.state === "recording") {
    recorder.stop();
    return;
  }
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    setStatus("Dieser Browser kann nicht aufnehmen - bitte Datei w\u00e4hlen.");
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    setStatus("Mikrofon verweigert: " + err.message);
    return;
  }
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const mime = (recorder && recorder.mimeType) || "audio/webm";
    try {
      stream.getTracks().forEach((t) => t.stop());
      clearInterval(timer); timer = null;
      const dot = $("dot"); if (dot) dot.classList.add("hidden");
      $("rec").classList.remove("on");
      setRecLabel("Aufnahme starten");
      const blob = new Blob(chunks, { type: mime });
      chunks = [];
      recorder = null;
      if (blob.size) send(blob); else setStatus("Keine Aufnahme.");
    } catch (err) {
      recorder = null;
      setRecLabel("Aufnahme starten");
      setStatus("Fehler beim Beenden der Aufnahme: " + err.message);
    }
  };
  recorder.onerror = (e) => {
    recorder = null;
    clearInterval(timer); timer = null;
    const dot = $("dot"); if (dot) dot.classList.add("hidden");
    $("rec").classList.remove("on");
    setRecLabel("Aufnahme starten");
    setStatus("Aufnahmefehler: " + ((e.error && e.error.name) || "unbekannt"));
  };
  recorder.start();
  started = Date.now();
  const dot = $("dot"); if (dot) dot.classList.remove("hidden");
  $("rec").classList.add("on");
  setRecLabel("Aufnahme stoppen");
  timer = setInterval(() => {
    setStatus("Aufnahme l\u00e4uft \u2026 " + ((Date.now() - started) / 1000).toFixed(0) + " s");
  }, 250);
};

/* ---- Datei / Drag & Drop ---- */
$("file").onchange = (e) => { if (e.target.files[0]) send(e.target.files[0]); };
const drop = $("drop");
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => {
  e.preventDefault(); drop.classList.add("hot");
}));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => {
  e.preventDefault(); drop.classList.remove("hot");
}));
drop.addEventListener("drop", (e) => {
  const f = e.dataTransfer.files[0];
  if (f) send(f);
});

/* ---- Ergebnis ---- */
$("save").onclick = () => {
  if (!out.value) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out.value], { type: "text/plain" }));
  a.download = "transkript-" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".txt";
  a.click();
  URL.revokeObjectURL(a.href);
};
$("clear").onclick = () => { out.value = ""; setStatus("Bereit."); };

/* ---- Zwischenablage mit Feedback ---- */
function flashCopy(btn) {
  if (!btn) return;
  const label = btn.querySelector("span");
  if (!btn.classList.contains("ok") && label) btn.dataset.prev = label.textContent;
  btn.classList.add("ok");
  if (label) label.textContent = "Kopiert";
  clearTimeout(btn._t);
  btn._t = setTimeout(() => {
    btn.classList.remove("ok");
    if (label) label.textContent = btn.dataset.prev || "Kopieren";
  }, 1600);
}

async function copyText(text, btn) {
  if (!text) return;
  let ok = true;
  try {
    await navigator.clipboard.writeText(text);
  } catch (err) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove();
  }
  if (ok) flashCopy(btn); else setStatus("Kopieren nicht erlaubt \u2013 Text bitte manuell markieren.");
}

/* ---- Verlauf (localStorage, neueste zuerst) ---- */
function loadHist() {
  try { const v = JSON.parse(localStorage.getItem(HIST_KEY) || "[]"); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
}
function saveHist(list) {
  try { localStorage.setItem(HIST_KEY, JSON.stringify(list.slice(0, HIST_MAX))); } catch (e) { /* voll/privat */ }
}
function fmtTs(ts) {
  return new Date(ts).toLocaleString("de-DE", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
}
function addHist(entry) {
  const list = loadHist();
  list.unshift(entry);
  saveHist(list);
  renderHist(entry.id);
}
function mkBtn(text, cls) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = text;
  if (cls) b.className = cls;
  return b;
}
function renderHist(highlightId) {
  const list = loadHist();
  const ul = $("histlist");
  ul.textContent = "";
  $("histempty").hidden = list.length > 0;
  $("histclear").hidden = list.length === 0;
  list.forEach((e) => {
    const li = document.createElement("li");
    li.className = "item" + (e.id === highlightId ? " new" : "");

    const meta = document.createElement("div");
    meta.className = "meta";
    const t = document.createElement("time");
    t.textContent = fmtTs(e.ts);
    meta.appendChild(t);
    const tl = document.createElement("span");
    tl.className = "tag";
    tl.textContent = e.lang && e.lang !== "auto" ? e.lang : "auto";
    meta.appendChild(tl);
    if (e.secs) {
      const ts = document.createElement("span");
      ts.className = "tag";
      ts.textContent = String(e.secs).replace(".", ",") + " s Audio";
      meta.appendChild(ts);
    }

    const p = document.createElement("p");
    p.className = "txt";
    p.textContent = e.text;
    p.title = "Klicken zum Auf-/Zuklappen";
    p.onclick = () => li.classList.toggle("open");

    const actions = document.createElement("div");
    actions.className = "actions";
    const bCopy = mkBtn("Kopieren", "copy");
    const bCopyLabel = document.createElement("span");
    bCopyLabel.textContent = "Kopieren";
    bCopy.textContent = "";
    bCopy.appendChild(bCopyLabel);
    bCopy.onclick = () => copyText(e.text, bCopy);
    const bUse = mkBtn("Ins Feld");
    bUse.onclick = () => {
      out.value = e.text;
      setStatus("Aus dem Verlauf übernommen.");
      out.scrollIntoView({ block:"center", behavior:"smooth" });
    };
    const bDel = mkBtn("L\u00f6schen", "ghost");
    bDel.onclick = () => { saveHist(loadHist().filter((x) => x.id !== e.id)); renderHist(); };
    actions.append(bCopy, bUse, bDel);

    li.append(meta, p, actions);
    ul.appendChild(li);
  });
}

$("copy").onclick = () => copyText(out.value, $("copy"));
$("histclear").onclick = () => {
  if (!loadHist().length) return;
  if (!confirm("Verlauf wirklich l\u00f6schen?")) return;
  saveHist([]);
  renderHist();
  setStatus("Verlauf gel\u00f6scht.");
};
renderHist();
</script>
</body>
</html>
