services:
  headscale:
    image: headscale/headscale:0.29.7
    container_name: headscale
    restart: unless-stopped
    command: serve
    env_file: .env
    volumes:
      - /etc/docker/headscale/config:/etc/headscale
      - /etc/docker/headscale/policy:/etc/headscale/policy:ro
      - /etc/docker/headscale/data:/var/lib/headscale
      - /etc/docker/headscale/run:/var/run/headscale
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.headscale.entrypoints=http"
      - "traefik.http.routers.headscale.rule=Host(`headscale.mueller-nas.de`)"
      - "traefik.http.middlewares.headscale-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.headscale.middlewares=headscale-https-redirect"
      - "traefik.http.routers.headscale-secure.entrypoints=https"
      - "traefik.http.routers.headscale-secure.rule=Host(`headscale.mueller-nas.de`)"
      - "traefik.http.routers.headscale-secure.tls=true"
      - "traefik.http.routers.headscale-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.headscale-secure.service=headscale"
      - "traefik.http.services.headscale.loadbalancer.server.port=8080"
networks:
  proxy:
    external: true
