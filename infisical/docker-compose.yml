services:
  infisical:
    image: infisical/infisical:latest
    container_name: infisical
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      - NODE_ENV=production
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - AUTH_SECRET=${AUTH_SECRET}
      - SITE_URL=https://infisical.mueller-nas.de
      - DB_CONNECTION_URI=postgres://infisical:${DB_PASSWORD}@db:5432/infisical?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_TIMEOUT=10000
      - REDIS_MAX_RETRIES=5
      - REDIS_COMMAND_TIMEOUT=5000
      - TELEMETRY_ENABLED=false
      - SECRET_DEFAULT_PATH=/infisical/secrets
    volumes:
      - /etc/docker/infisical/data:/infisical/secrets
    networks:
      - proxy
      - infisical_internal

  db:
    image: postgres:16-alpine
    container_name: infisical-db
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=infisical
      - POSTGRES_DB=infisical
    volumes:
      - /etc/docker/infisical/data/postgres:/var/lib/postgresql/data
    networks:
      - infisical_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: infisical-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - /etc/docker/infisical/data/redis:/data
    networks:
      - infisical_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  proxy:
    external: true
  infisical_internal:
    driver: bridge
